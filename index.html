<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khoá luyện thi IELTS cấp tốc - Lớp Anh thầy Kết</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

:root {
    --farm-green: #7ec850;
    --farm-dark-green: #4b8b29;
    --farm-sky: #a1dbff;
    --farm-brown: #8d5b4c;
    --farm-light-brown: #f4ece1;
    --farm-yellow: #ffdf00;
}

* {
    box-sizing: border-box;
}

body {
    font-family: 'Nunito', Arial, sans-serif;
    background: linear-gradient(180deg, var(--farm-sky) 0%, #d4f0ff 40%, #a2e048 40%, var(--farm-green) 100%);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    text-align: center;
    position: relative;
    overflow-x: hidden;
    color: #333;
}

/* --- MÂY TRÔI TRÊN BẦU TRỜI --- */
.cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    opacity: 0.85;
    animation: moveClouds linear infinite;
    z-index: 1;
}
.cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
}
.cloud1 { width: 120px; height: 40px; top: 30px; left: -150px; animation-duration: 25s; }
.cloud1::before { width: 50px; height: 50px; top: -20px; left: 20px; }
.cloud1::after { width: 40px; height: 40px; top: -15px; left: 55px; }

.cloud2 { width: 160px; height: 50px; top: 80px; left: -200px; animation-duration: 35s; animation-delay: 5s; }
.cloud2::before { width: 65px; height: 65px; top: -25px; left: 25px; }
.cloud2::after { width: 50px; height: 50px; top: -18px; left: 75px; }

@keyframes moveClouds {
    0% { left: -200px; }
    100% { left: 100vw; }
}

/* --- CÂY TÁO HAI BÊN --- */
.apple-tree-left, .apple-tree-right {
    position: fixed;
    top: 100px;
    width: 170px;
    height: 480px;
    z-index: 2;
    pointer-events: none;
}
.apple-tree-left { left: 10px; }
.apple-tree-right { right: 10px; transform: scaleX(-1); }

.tree-trunk {
    position: absolute;
    bottom: 0;
    left: 65px;
    width: 40px;
    height: 250px;
    background: linear-gradient(90deg, #5c3a21, #8b5a2b, #4a2e18);
    border-radius: 10px;
}
.tree-crown {
    position: absolute;
    top: 0;
    left: 10px;
    width: 150px;
    height: 250px;
    background: #388e3c;
    border-radius: 500px 500px 200px 200px;
    box-shadow: inset -15px -15px 0 #2e7d32, inset 15px 15px 0 #4caf50;
}

/* Quả táo hồng hào lắc lư */
.apple {
    position: absolute;
    width: 22px;
    height: 22px;
    background: #e53935;
    border-radius: 50%;
    box-shadow: inset -2px -2px 0 #b71c1c;
    animation: sway 2s ease-in-out infinite alternate;
}
.apple::before {
    content: '';
    position: absolute;
    top: -3px;
    left: 9px;
    width: 4px;
    height: 5px;
    background: #5d4037;
    border-radius: 2px;
}
.apple::after {
    content: '';
    position: absolute;
    top: -2px;
    left: 12px;
    width: 6px;
    height: 4px;
    background: #81c784;
    border-radius: 5px 0;
}

@keyframes sway {
    0% { transform: rotate(-5deg); }
    100% { transform: rotate(5deg); }
}

/* --- HÀNG RÀO NÔNG TRẠI --- */
.fence {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 55px;
    background: repeating-linear-gradient(90deg, #d7ccc8 0px, #d7ccc8 20px, transparent 20px, transparent 40px);
    border-top: 8px solid #a1887f;
    z-index: 2;
    pointer-events: none;
}

/* --- HEADER TRANG TRÍ HOẠT HÌNH --- */
header {
    position: relative;
    background: linear-gradient(135deg, #ff7043, #2196F3);
    color: white;
    padding: 35px 20px 25px;
    font-size: 32px;
    font-weight: 900;
    border-bottom: 8px solid #2196F3;
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    text-shadow: 2px 2px 0px #bf360c;
    z-index: 10;
}
header span {
    display: inline-block;
    transition: transform 0.3s;
}
header:hover span {
    transform: scale(1.05) rotate(-1deg);
}

/* --- CONTAINER CHÍNH (BẢNG GỖ) --- */
.toc-container {
    max-width: 1200px;
    margin: 40px auto 60px;
    background: #fffdf9;
    padding: 30px;
    border-radius: 24px;
    border: 6px solid var(--farm-brown);
    box-shadow: 0 12px 30px rgba(0,0,0,0.15), inset 0 0 15px rgba(141, 91, 76, 0.1);
    position: relative;
    z-index: 5;
}

/* Đinh ốc decor ở 4 góc bảng gỗ */
.toc-container::before, .toc-container::after {
    content: '🔩';
    position: absolute;
    font-size: 20px;
    top: 10px;
}
.toc-container::before { left: 15px; }
.toc-container::after { right: 15px; }

h2 {
    color: var(--farm-brown);
    font-size: 26px;
    font-weight: 800;
    margin-top: 0;
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

/* --- GRID BÀI HỌC --- */
.toc-item {
    display: grid;
    grid-template-columns: 2.5fr 1fr 1fr 0.8fr 3.5fr;
    gap: 12px;
    margin: 12px 0;
    align-items: stretch;
}

.toc-header div {
    background: #8d5b4c;
    color: white;
    padding: 14px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.5px;
    box-shadow: 0 3px 0 #5c3a21;
}

.lesson-link,
.study-session,
.study-time,
.video-link,
.homework-link {
    padding: 14px 16px;
    border-radius: 14px;
    text-decoration: none;
    color: #333;
    display: flex;
    align-items: center;
    font-weight: 700;
    font-size: 15px;
    transition: all 0.25s ease;
    box-shadow: 0 4px 0 rgba(0,0,0,0.06);
    border: 2px solid transparent;
}

.lesson-link {
    background: #e8f5e9;
    border-color: #c8e6c9;
    color: #2e7d32;
    justify-content: flex-start;
    text-align: left;
}
.lesson-link:hover {
    background: #c8e6c9;
}

.study-session {
    background: #fff8e1;
    border-color: #ffe082;
    color: #f57f17;
    justify-content: center;
}

.study-time {
    background: #f3e5f5;
    border-color: #e1bee7;
    color: #7b1fa2;
    justify-content: center;
    text-align: center;
    line-height: 1.4;
}

.video-link {
    background: #ffe0b2;
    border-color: #ffcc80;
    color: #e65100;
    justify-content: center;
    font-weight: 800;
}
.video-link:hover {
    background: #ffcc80;
    transform: translateY(-2px);
}

.homework-link {
    background: #fafafa;
    border-color: #eee;
    color: #424242;
    font-weight: 600;
    text-align: left;
    line-height: 1.5;
}

/* Hover hiệu ứng cả dòng bài học */
.toc-item.lesson:hover .lesson-link,
.toc-item.lesson:hover .study-session,
.toc-item.lesson:hover .study-time,
.toc-item.lesson:hover .video-link,
.toc-item.lesson:hover .homework-link {
    transform: translateY(-3px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
}

/* --- THÚ NUÔI ANIMATION (CHICKEN & PIG) --- */
.farm-animals {
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    margin-top: 30px;
    padding: 0 20px;
}

.animal {
    font-size: 45px;
    user-select: none;
    cursor: pointer;
    transition: transform 0.2s;
}
.animal:hover {
    transform: scale(1.3) rotate(10deg);
}

.rooster {
    animation: hop 1.8s infinite alternate;
}
.pig {
    animation: bounce 2.2s infinite alternate;
}
.cow {
    animation: sway 3s infinite alternate;
}

@keyframes hop {
    0% { transform: translateY(0); }
    50% { transform: translateY(-12px) rotate(-5deg); }
    100% { transform: translateY(0); }
}
@keyframes bounce {
    0% { transform: scale(1); }
    100% { transform: scale(1.15) translateY(-5px); }
}

/* NÚT QUAY VỀ */
.back-btn {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 30px;
    background: linear-gradient(135deg, #7cb342, #558b2f);
    color: white;
    font-weight: 800;
    font-size: 16px;
    text-decoration: none;
    border-radius: 50px;
    box-shadow: 0 5px 0 #33691e, 0 8px 15px rgba(0,0,0,0.15);
    transition: all 0.2s ease;
}
.back-btn:hover {
    background: linear-gradient(135deg, #8bc34a, #689f38);
    transform: translateY(-2px);
    box-shadow: 0 7px 0 #33691e, 0 10px 20px rgba(0,0,0,0.2);
}
.back-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #33691e;
}

footer {
    position: relative;
    margin-top: 40px;
    padding: 20px;
    background: #5d4037;
    color: #d7ccc8;
    font-weight: 700;
    z-index: 5;
    border-top: 5px solid #3e2723;
}

/* RESPONSIVE TRÊN DẾ YÊU */
@media(max-width: 1200px) {
    .apple-tree-left, .apple-tree-right { display: none; }
}

@media(max-width: 768px) {
    .toc-header {
        display: none;
    }

    .toc-item {
        grid-template-columns: 1fr;
        background: #fff;
        padding: 15px;
        border-radius: 16px;
        border: 2px solid #8d5b4c;
        margin-bottom: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    
    .lesson-link, .study-session, .study-time, .video-link, .homework-link {
        box-shadow: none;
    }
}
</style>
</head>

<body>

<!-- Mây trôi -->
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<!-- Cây táo hai bên -->
<div class="apple-tree-left">
    <div class="tree-trunk"></div>
    <div class="tree-crown">
        <div class="apple" style="top: 40px; left: 30px;"></div>
        <div class="apple" style="top: 80px; left: 90px; animation-delay: 0.3s;"></div>
        <div class="apple" style="top: 130px; left: 25px; animation-delay: 0.7s;"></div>
        <div class="apple" style="top: 170px; left: 80px; animation-delay: 0.2s;"></div>
    </div>
</div>

<div class="apple-tree-right">
    <div class="tree-trunk"></div>
    <div class="tree-crown">
        <div class="apple" style="top: 50px; left: 40px; animation-delay: 0.5s;"></div>
        <div class="apple" style="top: 90px; left: 100px;"></div>
        <div class="apple" style="top: 140px; left: 35px; animation-delay: 0.4s;"></div>
        <div class="apple" style="top: 180px; left: 75px; animation-delay: 0.8s;"></div>
    </div>
</div>

<header>
    <span>🌾 Luyện Thi IELTS Cấp Tốc - Lớp Anh Thầy Kết 🚜</span>
</header>

<div class="toc-container">

    <h2>🐥 LỊCH HỌC NÔNG TRẠI VUI VẺ 🌻</h2>

    <div class="toc-item toc-header">
        <div>Bài học</div>
        <div>Ca học</div>
        <div>Thời gian</div>
        <div>Bài giảng</div>
        <div>BTVN / Ghi chú</div>
    </div>

    <div id="lesson-list"></div>

    <!-- Thú nuôi hoạt hình trang trí bên dưới -->
    <div class="farm-animals">
        <span class="animal rooster" title="Gà trống gáy sáng!">🐓</span>
        <span class="animal cow" title="Bò sữa vui vẻ!">🐄</span>
        <span class="animal pig" title="Heo hồng ủn ỉn!">🐖</span>
    </div>

    <a href="https://ketng91.github.io/ielts.lopanhthayket/" class="back-btn">
        🏡 Quay về trang chính
    </a>

</div>

<!-- Hàng rào nông trại -->
<div class="fence"></div>

<footer>
    © 2026 Lớp Anh thầy Kết. All rights reserved. 🌽
</footer>

<script>
const lessons = [
    {
        lesson: "Buổi 1 - Lesson 1: Phát âm IPA. Ứng dụng câu đơn - Cách nói Thích/Không thích. Viết cơ bản.",
        lessonLink: "#",
        session: "Ca chiều 2",
        time: "T5 05/11<br>2:00 - 3:30",
        video: "#",
        homework: "#",
        note: "Ôn tập, học và thực hành nội dung đã học. Chuẩn bị kiểm tra đầu giờ buổi sau."
    },
    {
        lesson: "Buổi 2 - Lesson 1 & 2: Phát âm IPA & Alphabet & Number. Reading - Dạng TRUE FALSE NOT GIVEN",
        lessonLink: "#",
        session: "Ca chiều 2",
        time: "T6 06/11<br>3:05 - 4:35",
        video: "#",
        homework: "#",
        note: ""
    }
];

const container = document.getElementById("lesson-list");

// Xếp bài học theo ngày: mới nhất → cũ nhất
lessons.sort((a, b) => {
    const getDate = (time) => {
        const match = time.match(/(\d{2})\/(\d{2})/);
        if (!match) return new Date(0);

        const [, day, month] = match;
        return new Date(2026, Number(month) - 1, Number(day));
    };

    return getDate(b.time) - getDate(a.time);
});

lessons.forEach(item => {
    container.innerHTML += `
    <div class="toc-item lesson">
        <a class="lesson-link" href="${item.lessonLink}" target="_blank">
            📖 ${item.lesson}
        </a>

        <div class="study-session">
            ⏰ ${item.session}
        </div>

        <div class="study-time">
            📅 ${item.time}
        </div>

        <a class="video-link" href="${item.video}" target="_blank">
            🎬 Video
        </a>

        <a class="homework-link" href="${item.homework}" target="_blank">
            📝 ${item.note || "Không có ghi chú"}
        </a>
    </div>
    `;
});
</script>

</body>
</html>
